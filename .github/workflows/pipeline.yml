name: pipeline

on:
  schedule:
    - cron: "17 11 * * 1-6"
    - cron: "23 9 * * 0"
  workflow_dispatch:
    inputs:
      modo:
        description: "ventana = mes actual y anterior; completa = desde 2020"
        type: choice
        options: [ventana, completa]
        default: ventana

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Definir el periodo
        run: |
          if [ "${{ github.event.schedule }}" = "23 9 * * 0" ] || [ "${{ inputs.modo }}" = "completa" ]; then
            echo "DESDE=2020-01" >> "$GITHUB_ENV"
          else
            echo "DESDE=$(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m)" >> "$GITHUB_ENV"
          fi
          echo "HASTA=$(date +%Y-%m)" >> "$GITHUB_ENV"

      - name: Ingesta SECOP II
        run: python ingesta/secop.py "$DESDE" "$HASTA"

      - name: Ingesta TVEC
        if: ${{ !cancelled() }}
        run: python ingesta/tvec.py "$DESDE" "$HASTA"

      - name: dbt build
        if: ${{ !cancelled() }}
        working-directory: transformacion
        run: dbt build --profiles-dir .
      
name: pipeline

on:
  schedule:
    - cron: "17 11 * * 1-6"
    - cron: "23 9 * * 0"
  workflow_dispatch:
    inputs:
      modo:
        description: "ventana = mes actual y anterior; completa = desde 2020"
        type: choice
        options: [ventana, completa]
        default: ventana

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Definir el periodo
        run: |
          if [ "${{ github.event.schedule }}" = "23 9 * * 0" ] || [ "${{ inputs.modo }}" = "completa" ]; then
            echo "DESDE=2020-01" >> "$GITHUB_ENV"
          else
            echo "DESDE=$(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m)" >> "$GITHUB_ENV"
          fi
          echo "HASTA=$(date +%Y-%m)" >> "$GITHUB_ENV"

      - name: Ingesta SECOP II
        run: python ingesta/secop.py "$DESDE" "$HASTA"

      - name: Ingesta TVEC
        if: ${{ !cancelled() }}
        run: python ingesta/tvec.py "$DESDE" "$HASTA"

      - name: dbt build
        if: ${{ !cancelled() }}
        working-directory: transformacion
        run: dbt build --profiles-dir .

      - name: Documentación dbt
        working-directory: transformacion
        run: |
          dbt docs generate --profiles-dir .
          mkdir -p ../sitio_docs
          cp target/index.html target/manifest.json target/catalog.json ../sitio_docs/

      - name: Subir sitio de documentación
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio_docs
          
  publicar_docs:
    needs: cargar
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
  
  mantener_activo:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Commit si el repo lleva 45 días quieto
        run: |
          ultimo=$(git log -1 --format=%ct)
          dias=$(( ( $(date +%s) - ultimo ) / 86400 ))
          echo "Último commit hace $dias días"

          if [ "$dias" -lt 0 ]; then
            exit 0
          fi

          date -u +%F > .github/ultima_actividad
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ultima_actividad
          git commit -m "Mantiene activo el workflow programado"
          git push
        
      

name: gasto_tic
version: "1.0.0"
profile: gasto_tic

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

models:
  gasto_tic:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      
seeds:
  gasto_tic:
    etiquetas_manuales:
      +column_types: {id: text}
    terminos_fabricante:
      +column_types: {debil: boolean}
    correcciones_manuales:
      +column_types: {id: text}
